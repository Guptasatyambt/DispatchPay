# Base configuration shared by every environment.
# Secrets are never stored here: they are injected through environment variables
# (or a git-ignored .env file in the dev profile).
spring:
  application:
    name: dispatchpay
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

# Only health (with liveness/readiness probes) is exposed; everything else is off.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,objectStorage

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

dispatchpay:
  scheduling:
    enabled: true
  auth:
    jwt:
      issuer: dispatchpay
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
    session:
      refresh-token-ttl: 30d
      max-lifetime: 90d
      refresh-per-ip: { limit: 60, window: 1h }
    otp:
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 30s
      pepper: ${OTP_PEPPER}
      limits:
        request-per-mobile: { limit: 3, window: 15m }
        request-per-mobile-daily: { limit: 10, window: 24h }
        request-per-device: { limit: 10, window: 1h }
        request-per-ip: { limit: 30, window: 1h }
        verify-per-ip: { limit: 60, window: 1h }
  invitation:
    ttl: 7d
  idempotency:
    retention: 24h
    cleanup-interval: 1h
  outbox:
    poll-interval: 1s
    batch-size: 50
    max-attempts: 10
    initial-backoff: 2s
    max-backoff: 10m
  # Private S3-compatible object storage. Objects are never public: clients only get short-lived
  # pre-signed URLs for one object.
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    # Host the pre-signed URLs point at, when clients reach storage differently from the server.
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    path-style-access: true
    # Only local stacks create the bucket; real environments provision it.
    create-bucket: false
  imports:
    max-file-size: 2MB
    max-rows: 5000
    upload-url-ttl: 15m
    download-url-ttl: 5m
    poll-interval: 2s
    # A worker owns a claimed import this long; a crashed worker's import is picked up again after it.
    lease: 5m
    max-attempts: 5
