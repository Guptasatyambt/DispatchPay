# Base configuration shared by every environment.
# Secrets are never stored here: they are injected through environment variables
# (or a git-ignored .env file in the dev profile).
spring:
  application:
    name: dispatchpay
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

# Only health (with liveness/readiness probes) is exposed; everything else is off.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

dispatchpay:
  scheduling:
    enabled: true
  auth:
    jwt:
      issuer: dispatchpay
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
    session:
      refresh-token-ttl: 30d
      max-lifetime: 90d
      refresh-per-ip: { limit: 60, window: 1h }
    otp:
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 30s
      pepper: ${OTP_PEPPER}
      limits:
        request-per-mobile: { limit: 3, window: 15m }
        request-per-mobile-daily: { limit: 10, window: 24h }
        request-per-device: { limit: 10, window: 1h }
        request-per-ip: { limit: 30, window: 1h }
        verify-per-ip: { limit: 60, window: 1h }
  invitation:
    ttl: 7d
  idempotency:
    retention: 24h
    cleanup-interval: 1h
  outbox:
    poll-interval: 1s
    batch-size: 50
    max-attempts: 10
    initial-backoff: 2s
    max-backoff: 10m
